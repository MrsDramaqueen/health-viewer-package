name: Test WMS CI upload

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload file to WMS
        env:
          WMS_URL: ${{ secrets.WMS_UPLOAD_URL }}
        run: |
          set -euo pipefail

          if [[ "${WMS_URL}" != https://* ]]; then
            echo "WMS_UPLOAD_URL must start with https://"
            exit 1
          fi

          echo "health-viewer-package ci upload test $(date -u +%Y-%m-%dT%H:%M:%SZ)" > test-payload.txt

          # Не передаём JWT между step'ами через outputs/env — GitHub может замaskить
          # часть строки (***), и подпись станет невалидной.
          OIDC_TOKEN=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mpfit-wms-ci" \
            | jq -r .value)

          if [[ -z "${OIDC_TOKEN}" || "${OIDC_TOKEN}" == "null" ]]; then
            echo "Failed to fetch OIDC token"
            exit 1
          fi

          echo "token_length=${#OIDC_TOKEN}"

          curl -f -sS -D /tmp/wms-response-headers -o /tmp/wms-response-body -X PUT \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "X-GitHub-Oidc-Token: ${OIDC_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            -H "ngrok-skip-browser-warning: 1" \
            --data-binary @test-payload.txt \
            "${WMS_URL}"

          echo "--- response headers ---"
          cat /tmp/wms-response-headers
          echo "--- response body ---"
          cat /tmp/wms-response-body
